<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- DoraHub logo「半脸 D · 三须 · 弧嘴」
       大圆半脸（碗凸向右，直边=脸中线）= 机器猫半边脸 & Dora 的 D
       红鼻 = 云端 hub（会话住在脸里）
       三须 = workpc / laptop / phone 三台设备伸出去接
       弧嘴 = 机器猫咧嘴笑的右半，从脸中线长出 -->
  <style>
    @media (prefers-color-scheme: dark) {
      .face-fill { fill: #191713; }
      .face-line { stroke: #4aa3d8; }
      .nose { fill: #e05a4e; }
      .ink { stroke: #e8e4d8; }
    }
  </style>
  <rect width="64" height="64" rx="15" fill="#f4f1e9"/>
  <path class="face-fill face-line" d="M17 8.5a24.5 24.5 0 1 1 0 47" fill="#fffdf7" stroke="#2d8fc4" stroke-width="5" stroke-linecap="round"/>
  <path class="face-line" d="M17 8.5V55.5" fill="none" stroke="#2d8fc4" stroke-width="5" stroke-linecap="round"/>
  <circle class="nose" cx="26" cy="18.5" r="4.4" fill="#c2372c"/>
  <g class="ink" fill="none" stroke="#1c1a17" stroke-width="2.3" stroke-linecap="round">
    <path d="M31 25Q42 20.5 54 19"/>
    <path d="M33 32Q45 32 57 32"/>
    <path d="M31 36Q42 40 53 41.5"/>
  </g>
  <path class="ink" d="M17 43Q28 54 39 44.5" fill="none" stroke="#1c1a17" stroke-width="2.6" stroke-linecap="round"/>
</svg>
